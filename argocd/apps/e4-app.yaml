# ============================================================
# Argo CD Application — E4 Platform Infrastructure
#
# What this file does:
#   This is the ROOT "App of Apps" — a special Argo CD pattern
#   where ONE application manages ALL other applications.
#
#   Instead of pointing to a service's code, this app points
#   to the argocd/apps/ folder in THIS repository.
#   Argo CD reads every .yaml file in that folder and registers
#   each one as an Application — so e1, e2, e3, and e4 are all
#   automatically set up from a single kubectl apply.
#
# How to bootstrap the entire system:
#   Step 1: kubectl apply -f argocd/apps/e4-app.yaml
#   Step 2: Argo CD will read the rest of the files in argocd/apps/
#           and register e1-app, e2-app, e3-app automatically.
#   That's it — the whole system is live from one command.
#
# How to apply just this file:
#   kubectl apply -f argocd/apps/e4-app.yaml
# ============================================================

# apiVersion — which version of the Argo CD API spec to use
apiVersion: argoproj.io/v1alpha1

# kind — the type of Kubernetes resource this file describes
kind: Application

# metadata — basic identifying information about this resource
metadata:
  # name — the unique name Argo CD uses to identify this root application
  name: e4-platform

  # namespace — Argo CD Application objects always live in the argocd namespace
  namespace: argocd

# spec — the main configuration
spec:

  # project — "default" is the built-in Argo CD project
  project: default

  # source — points to THIS repository, to the argocd/apps/ folder
  # Argo CD will read every .yaml file in that folder
  source:
    # repoURL — the platform-infra repository (this repo)
    repoURL: https://github.com/Prypiatos/platform-infra.git

    # targetRevision — always read from the main branch
    targetRevision: main

    # path — the folder that contains all the Application YAML files
    # This is the "App of Apps" pattern: manage apps with an app
    path: argocd/apps

  # destination — where the Application CRD objects themselves are deployed
  # Application objects live in the argocd namespace (not a service namespace)
  destination:
    # server — deploy to the same cluster Argo CD is installed on
    server: https://kubernetes.default.svc

    # namespace — Application CRDs must be in the argocd namespace
    namespace: argocd

  # syncPolicy — automatic deployment settings
  syncPolicy:

    # automated — Argo CD syncs this app automatically on every Git change
    automated:
      # prune — if an app YAML is deleted from Git, remove it from Argo CD too
      prune: true

      # selfHeal — revert any manual changes back to what Git says
      selfHeal: true

    # syncOptions — additional sync behaviour
    syncOptions:
      # CreateNamespace — create the argocd namespace if it doesn't exist
      # (usually it already exists because Argo CD is installed there)
      - CreateNamespace=true
