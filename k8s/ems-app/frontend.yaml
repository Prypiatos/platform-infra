apiVersion: v1
kind: Service
metadata:
  name: ems-frontend
  labels:
    app: ems-frontend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: ems-frontend
  type: NodePort
  # NodePort exposes on a port in the 30000-32767 range; using 30080 here
  # may require cluster admin privileges. Adjust if necessary.
  externalIPs: []

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-frontend
  template:
    metadata:
      labels:
        app: ems-frontend
    spec:
      containers:
        - name: ems-frontend
          # Replace with your image pushed to a registry (e.g. myregistry/myfront:latest)
          image: myfront:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_BASE_URL
              value: "http://ems-backend:8080"
