apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: data-intelligence-monitoring
data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: PBFA97CFB590B2093
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true