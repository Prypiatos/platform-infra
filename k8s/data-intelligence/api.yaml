apiVersion: v1
kind: Service
metadata:
  name: data-intelligence-api
spec:
  type: ClusterIP
  selector:
    app: data-intelligence-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-intelligence-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-intelligence-api
  template:
    metadata:
      labels:
        app: data-intelligence-api
    spec:
      containers:
        - name: api
sheharakarunarathna/e2-api:5b3d18c66f5cbb98de6f231cd893f3f7e4f4ad9c
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: data-intelligence-config
            - secretRef:
                name: data-intelligence-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
