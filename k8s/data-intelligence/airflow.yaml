apiVersion: v1
kind: Service
metadata:
  name: airflow
spec:
  type: ClusterIP
  selector:
    app: airflow
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: sheharakarunarathna/e2-airflow:75fff839b40f26815a0a1ff07e64c9f0fdf6751e
          imagePullPolicy: Always
          command:
            - bash
            - -c
            - >
              airflow db init &&
              airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD}
              --firstname Admin --lastname User --role Admin --email admin@example.com || true &&
              airflow webserver & airflow scheduler
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: data-intelligence-config
            - secretRef:
                name: data-intelligence-secrets
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
            - name: airflow-data
              mountPath: /opt/airflow/data
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes:
        - name: airflow-dags
          configMap:
            name: airflow-dags
        - name: airflow-data
          persistentVolumeClaim:
            claimName: airflow-data
