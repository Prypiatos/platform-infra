apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly
  template:
    metadata:
      labels:
        app: anomaly
    spec:
      containers:
        - name: anomaly
          image: sheharakarunarathna/e2-anomaly:91854711608e98bad8ccf49bb69e3d50aceaa113
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: data-intelligence-config
            - secretRef:
                name: data-intelligence-secrets
