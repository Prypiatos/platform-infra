# HiveMQ stores runtime data under /opt/hivemq/data in the compose setup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hivemq-data
  namespace: mqtt
  labels:
    app.kubernetes.io/name: hivemq
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# HiveMQ also writes logs under /opt/hivemq/log in the compose setup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hivemq-log
  namespace: mqtt
  labels:
    app.kubernetes.io/name: hivemq
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
