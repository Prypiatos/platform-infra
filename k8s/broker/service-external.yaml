apiVersion: v1
kind: Service
metadata:
  name: hivemq-external
  namespace: mqtt
  labels:
    app.kubernetes.io/name: hivemq
    app.kubernetes.io/part-of: mqtt
spec:
  # NodePort exposes MQTT outside the cluster through the node IPs.
  # In this project, devices should connect to the control-plane Elastic IP
  # because that is the stable public address on AWS.
  type: NodePort

  # Cluster mode is important here because the Elastic IP lands on the
  # control-plane EC2 instance, while the HiveMQ pod may run on a worker node.
  # This lets Kubernetes forward MQTT traffic across the cluster correctly.
  externalTrafficPolicy: Cluster

  selector:
    app.kubernetes.io/name: hivemq

  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      nodePort: 31883
      protocol: TCP
