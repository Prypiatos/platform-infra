apiVersion: v1
kind: Service
metadata:
  name: hivemq
  namespace: mqtt
  labels:
    app.kubernetes.io/name: hivemq
    app.kubernetes.io/part-of: mqtt
spec:
  # ClusterIP keeps the broker internal to the Kubernetes cluster first.
  # If external devices need direct access later, change this to NodePort or
  # LoadBalancer and expose only the ports you actually need.
  type: ClusterIP

  selector:
    app.kubernetes.io/name: hivemq

  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    - name: web-ui
      port: 8080
      targetPort: web-ui
      protocol: TCP
