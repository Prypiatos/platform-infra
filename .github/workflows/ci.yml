      # TEMPORARY placeholder step so the job does not fail while Argo CD is not yet set up
      - name: Placeholder — Argo CD sync will run here once cluster is ready
        run: |
          echo "=========================================="
          echo " Argo CD sync step is not active yet."
          echo " Uncomment the steps above once:"
          echo "   1. Kubernetes cluster is running"
          echo "   2. Argo CD is installed on the cluster"
