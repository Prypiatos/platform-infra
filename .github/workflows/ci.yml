      #   run: |
      #     # Log in to the Argo CD server using secrets stored in GitHub
      #     # ARGOCD_SERVER = the URL of your Argo CD server (e.g. argocd.example.com)
      #     # ARGOCD_TOKEN  = an Argo CD API token (created in Argo CD UI → Settings → Accounts)
      #     argocd login ${{ secrets.ARGOCD_SERVER }} \
      #       --auth-token ${{ secrets.ARGOCD_TOKEN }} \
      #       --insecure      # Remove --insecure if you have a valid TLS certificate
