[defaults]
# Use the inventory file in this folder by default.
inventory = inventory.ini

# Ubuntu is the SSH user for the EC2 instances.
remote_user = ubuntu

# Update this path to the private key that matches your AWS EC2 key pair.
private_key_file = ~/.ssh/sheron@archlinux.pem

# Disable strict host key checking for simpler first-time lab/project use.
host_key_checking = False

# Avoid creating .retry files after failed runs.
retry_files_enabled = False

# Keep Python interpreter detection quiet on Ubuntu hosts.
interpreter_python = auto_silent
