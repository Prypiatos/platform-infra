# Replace the placeholder IPs below with the real EC2 addresses.
# `ansible_host` is the address Ansible uses to SSH into the instance.
# `k3s_api_ip` should usually be the control-plane node's PRIVATE IP so workers
# can join over the VPC network instead of going out through the public internet.
# `control_plane_elastic_ip` is the public Elastic IP that external kubectl
# clients will use to reach the API server over HTTPS.

[control_plane]
control-plane ansible_host=47.131.156.141 k3s_api_ip=172.31.21.104 control_plane_elastic_ip=CONTROL_PLANE_ELASTIC_IP

[workers]
worker-1 ansible_host=3.0.93.65
worker-2 ansible_host=13.215.158.240

[k3s_cluster:children]
control_plane
workers

[all:vars]
# Ubuntu is the default SSH user for the Ubuntu EC2 AMI.
ansible_user=ubuntu
